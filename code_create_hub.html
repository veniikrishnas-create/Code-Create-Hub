<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Create Hub • Online Code Editor</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
      background: rgba(0, 0, 0, 0.5);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
    }

    .editors {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .editor h3 {
      margin: 0;
      padding: 6px 10px;
      font-size: 14px;
      background: rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .editor textarea {
      flex: 1;
      background: #111;
      color: #0f0;
      border: none;
      outline: none;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: none;
    }
    /* 🔹 Navbar Style */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 25px;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(6px);
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

header .logo {
  font-size: 2rem;
  font-weight: bold;
  color: #00ffcc;
  text-shadow: 0 0 8px #00ffcc;
}

header nav {
  display: flex;
  gap: 10px;
}

header nav a {
  text-decoration: none;
  font-weight: bold;
  text-size-adjust: 1px;;
  color: white;
  transition: 0.3s;
  padding: 6px 10px;
  border-radius: 4px;
}

header nav a:hover {
  background: #00ffcc;
  color: black;
  box-shadow: 0 0 8px #00ffcc;
}

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 6px;
      background: white;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.5);
      color: #ccc;
    }

    footer span {
      color: #00ffcc;
      font-weight: bold;
    }
  
async function askGemini (prompt) {
  const response = await fetch("http://127.0.0.1:5000/ask", 
  {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify ({ prompt })
  });

  const data = await response.json();
  alert("Gemini says: " + data.reply);
}

// ✅ Corrected version with matching backticks
document.body.insertAdjacentHTML("beforeend", `
  <button onclick="askGemini('Explain HTML in simple words')"
          style="position:fixed;bottom:20px;right:20px;
                 background:#00ffcc;color:black;padding:10px 15px;
                 border:none;border-radius:6px;cursor:pointer;">
    🔮 Ask Gemini
  </button>
`);

  </style>
</head>
<body>
   <header>
  <div class="logo">🚀 Code Create Hub</div>
  <nav>
    <a href="code_create_hub.html" class="btn">ScriptSpace</a>
    <a href="about.html" class="btn">Journey</a>
    <a href="help.html" class="btn">Guidance</a>
    <a href="review.html" class="btn">Review Corner</a>
    <a href="tutorial.html" class="btn">CodeAcademy</a>
    <a href="builder.html" class="btn">CreatorDeck</a>
  </nav>
</header>

  <main>
    <div class="editors">
      <div class="editor">
        <h3>HTML 🟥</h3>
        <textarea id="htmlCode" placeholder="Write HTML here..."></textarea>
      </div>
      <div class="editor">
        <h3>CSS 🟦</h3>
        <textarea id="cssCode" placeholder="Write CSS here..."></textarea>
      </div>
      <div class="editor">
        <h3>JavaScript 🟨</h3>
        <textarea id="jsCode" placeholder="Write JavaScript here..."></textarea>
      </div>
    </div>

    <iframe id="output"></iframe>
  </main>

  <footer>Made with ❤️ by <span>Code Create Hub</span></footer>

  <script>
    const htmlCode = document.getElementById("htmlCode");
    const cssCode = document.getElementById("cssCode");
    const jsCode = document.getElementById("jsCode");
    const output = document.getElementById("output");

    function runCode() {
      const html = htmlCode.value;
      const css = "<style>" + cssCode.value + "</style>";
      const js = "<script>" + jsCode.value + "<\/script>";
      output.srcdoc = html + css + js;
    }

    document.querySelectorAll("textarea").forEach(area => {
      area.addEventListener("input", runCode);
    });
  </script>
</body>
</html>
